name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本标签，例如 v1.2.3；留空则仅测试和构建"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.version == '' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s\n' "$INPUT_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号需形如 v1.2.3 或 v1.2.3-rc.1"
            exit 1
          fi

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Build check
        run: go build -o /tmp/ddns-panel .

  build:
    name: Build linux/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            filename: ddns-linux-amd64
          - arch: arm64
            filename: ddns-linux-arm64
    env:
      VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('dev-{0}', github.sha) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o "${{ matrix.filename }}" .

      - name: Verify binary
        run: |
          chmod +x "${{ matrix.filename }}"
          file "${{ matrix.filename }}"
          sha256sum "${{ matrix.filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify binary version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          chmod +x dist/ddns-linux-amd64
          output="$(dist/ddns-linux-amd64 version)"
          echo "$output"
          if ! printf '%s\n' "$output" | grep -Fq "ddns-panel ${RELEASE_VERSION} "; then
            echo "::error::二进制版本与发布标签 ${RELEASE_VERSION} 不一致"
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ddns-linux-amd64
            dist/ddns-linux-arm64
          generate_release_notes: true
          fail_on_unmatched_files: true
